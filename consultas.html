<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#208049" />
    <title>Minhas Consultas · CRIMED</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/pages.css" />
    <link rel="stylesheet" href="assets/css/paciente.css" />
  </head>

  <body data-page="consultas">
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

    <div class="app">
      <aside data-shell="sidebar"></aside>
      <div class="sidebar-scrim"></div>

      <div class="app-main">
        <header data-shell="topbar"></header>

        <main class="app-content pac-content" id="conteudo">
          <a class="cta-agendar cta-agendar-compacto" href="agendar.html">
            <span class="cta-agendar-ico"><i data-ico="calendar-plus"></i></span>
            <span class="cta-agendar-txt">
              <strong>Agendar nova consulta</strong>
              <small>Com clínico geral, por vídeo</small>
            </span>
            <i data-ico="chevron-right"></i>
          </a>

          <div class="seg-abas" id="abas-consulta" role="tablist">
            <button class="is-active" data-aba="proximas" role="tab" aria-selected="true">
              Próximas <span class="seg-num" id="qtd-proximas">0</span>
            </button>
            <button data-aba="anteriores" role="tab" aria-selected="false">
              Anteriores <span class="seg-num" id="qtd-anteriores">0</span>
            </button>
          </div>

          <div class="cc-lista" id="lista-consultas"></div>
        </main>
      </div>
    </div>

    <div id="cris-root"></div>
    <div id="toast-container"></div>

    <script src="assets/js/icons.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/core.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/paciente.js"></script>
    <script src="assets/js/assistente.js"></script>
  </body>
</html>
