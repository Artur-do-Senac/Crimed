<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#208049" />
    <title>Minhas Consultas · CRIMED</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/pages.css" />
  </head>

  <body data-page="consultas">
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

    <div class="app">
      <aside data-shell="sidebar"></aside>
      <div class="sidebar-scrim"></div>

      <div class="app-main">
        <header data-shell="topbar"></header>

        <main class="app-content" id="conteudo">
          <div class="dash-grid">
            <section class="col-12">
              <div class="card card-pad-lg">
                <div class="card-head">
                  <div class="pill-tabs" id="filtros-consulta">
                    <button class="pill-tab is-active" data-filtro="Todas">Todas</button>
                    <button class="pill-tab" data-filtro="Confirmada">Agendadas</button>
                    <button class="pill-tab" data-filtro="Realizada">Realizadas</button>
                    <button class="pill-tab" data-filtro="Cancelada">Canceladas</button>
                  </div>
                  <div class="row" style="gap: 0.5rem">
                    <div class="input-icon" style="min-width: 200px">
                      <i data-ico="search"></i>
                      <input
                        type="search"
                        class="input"
                        id="busca-consulta"
                        placeholder="Buscar profissional…"
                        aria-label="Buscar consulta"
                      />
                    </div>
                    <button class="btn btn-primary" data-act="agendar">
                      <i data-ico="calendar-plus"></i> Agendar
                    </button>
                  </div>
                </div>

                <div id="lista-consultas"></div>
              </div>
            </section>

            <section class="col-12">
              <div class="card card-pad-lg">
                <div class="card-head">
                  <h3><i data-ico="calendar"></i> Sua agenda do mês</h3>
                  <span class="small muted" id="calendario-mes"></span>
                </div>
                <div id="calendario"></div>
              </div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <div id="cris-root"></div>
    <div id="toast-container"></div>

    <script src="assets/js/icons.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/core.js"></script>
    <script src="assets/js/charts.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/paciente.js"></script>
    <script src="assets/js/assistente.js"></script>
  </body>
</html>
