<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#208049" />
    <title>Prontuário e Exames · CRIMED</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/pages.css" />
  </head>

  <body data-page="prontuarios">
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

    <div class="app">
      <aside data-shell="sidebar"></aside>
      <div class="sidebar-scrim"></div>

      <div class="app-main">
        <header data-shell="topbar"></header>

        <main class="app-content" id="conteudo">
          <!-- ============================================ RESUMO CLÍNICO -->
          <section class="card card-pad-lg mb-3" id="resumo-clinico"></section>

          <div class="tabs mb-3" id="tabs-prontuario">
            <button class="tab is-active" data-aba="prontuario">
              <i data-ico="file-medical"></i> Prontuário
            </button>
            <button class="tab" data-aba="exames">
              <i data-ico="flask"></i> Exames
            </button>
            <button class="tab" data-aba="receitas">
              <i data-ico="pill"></i> Receitas digitais
            </button>
          </div>

          <!-- ================================================ PRONTUÁRIO -->
          <section data-pane="prontuario">
            <div class="card card-pad-lg">
              <div class="card-head">
                <h3><i data-ico="history"></i> Histórico clínico</h3>
                <span class="small muted">
                  Registros feitos por profissionais da rede municipal
                </span>
              </div>
              <div id="lista-prontuarios"></div>
            </div>
          </section>

          <!-- ===================================================== EXAMES -->
          <section data-pane="exames" hidden>
            <div class="card card-pad-lg">
              <div class="card-head">
                <h3><i data-ico="flask"></i> Exames e laudos</h3>
                <span class="badge badge-info">
                  <i data-ico="info"></i> Resultados liberados pelo laboratório municipal
                </span>
              </div>
              <div id="lista-exames"></div>
            </div>
          </section>

          <!-- =================================================== RECEITAS -->
          <section data-pane="receitas" hidden>
            <div class="stack" style="--gap: 1.25rem" id="lista-receitas"></div>
          </section>
        </main>
      </div>
    </div>

    <!-- ================================================ MODAL PRONTUÁRIO -->
    <div class="modal" id="modal-prontuario">
      <div class="modal-box modal-box-lg">
        <button class="modal-close" data-close-modal><i data-ico="close"></i></button>
        <div class="modal-head">
          <h3><i data-ico="file-medical"></i> Prontuário eletrônico</h3>
          <p id="pront-cabecalho"></p>
        </div>
        <div id="pront-corpo"></div>
        <div class="modal-foot">
          <button class="btn btn-ghost" data-close-modal>Fechar</button>
          <button class="btn btn-primary" id="btn-imprimir-pront">
            <i data-ico="print"></i> Imprimir / PDF
          </button>
        </div>
      </div>
    </div>

    <!-- ===================================================== MODAL EXAME -->
    <div class="modal" id="modal-exame">
      <div class="modal-box">
        <button class="modal-close" data-close-modal><i data-ico="close"></i></button>
        <div class="modal-head">
          <h3><i data-ico="flask"></i> <span id="exame-titulo"></span></h3>
          <p id="exame-sub"></p>
        </div>
        <div id="exame-corpo"></div>
        <div class="modal-foot">
          <button class="btn btn-ghost" data-close-modal>Fechar</button>
          <button class="btn btn-primary" id="btn-imprimir-exame">
            <i data-ico="print"></i> Imprimir laudo
          </button>
        </div>
      </div>
    </div>

    <div id="cris-root"></div>
    <div id="toast-container"></div>

    <script src="assets/js/icons.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/core.js"></script>
    <script src="assets/vendor/qrcode.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/paciente.js"></script>
    <script src="assets/js/assistente.js"></script>
  </body>
</html>
